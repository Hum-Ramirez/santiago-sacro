spring:
  application:
    name: santiago-sacro-api

  datasource:
    url: jdbc:h2:mem:santiagosacro;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

santiagosacro:
  jwt:
    # Clave de demostracion academica. En produccion va fuera del repositorio.
    secreto: "santiago-sacro-duoc-dsy1105-clave-de-firma-hs256-2026"
    expiracion-ms: 86400000
  seed:
    activo: true

logging:
  level:
    cl.duoc.santiagosacro: DEBUG
